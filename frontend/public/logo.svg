<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 48" width="300" height="48">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4B85C"/>
      <stop offset="50%" style="stop-color:#C9A84C"/>
      <stop offset="100%" style="stop-color:#B8943F"/>
    </linearGradient>
  </defs>
  <!-- Shield -->
  <g transform="translate(4, 2)">
    <path d="M18 2 L33 7 L33 22 C33 32 26 38 18 42 C10 38 3 32 3 22 L3 7 Z" fill="#1A1A1A" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <!-- Center vertical gold line -->
    <line x1="18" y1="8" x2="18" y2="37" stroke="#C9A84C" stroke-width="1.0" stroke-linecap="round"/>
    <!-- Calligraphic heraldic initials — italic serif with fine strokes -->
    <text x="11" y="25" font-family="'Cormorant Garamond', 'Garamond', 'Palatino', 'Book Antiqua', serif" font-size="11" font-style="italic" font-weight="400" fill="#C9A84C" text-anchor="middle" opacity="0.9">F</text>
    <text x="25" y="25" font-family="'Cormorant Garamond', 'Garamond', 'Palatino', 'Book Antiqua', serif" font-size="11" font-style="italic" font-weight="400" fill="#C9A84C" text-anchor="middle" opacity="0.9">S</text>
  </g>
  <!-- Main text -->
  <text x="68" y="23" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="16" font-weight="700" fill="#1A1A1A" letter-spacing="0.3">Stratégie &amp; Expertise Santé</text>
  <!-- Subtitle -->
  <line x1="68" y1="33" x2="88" y2="33" stroke="url(#goldGrad)" stroke-width="0.6" stroke-linecap="round"/>
  <text x="93" y="37" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="6.5" fill="#C9A84C" letter-spacing="4.2" font-weight="400">PIONNIER EN FRANCE</text>
  <line x1="244" y1="33" x2="264" y2="33" stroke="url(#goldGrad)" stroke-width="0.6" stroke-linecap="round"/>
</svg>
