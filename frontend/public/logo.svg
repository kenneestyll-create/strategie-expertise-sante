<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" width="280" height="48">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4B85C"/>
      <stop offset="50%" style="stop-color:#C9A84C"/>
      <stop offset="100%" style="stop-color:#B8943F"/>
    </linearGradient>
  </defs>
  <!-- Shield -->
  <g transform="translate(4, 2)">
    <!-- Shield body -->
    <path d="M18 2 L33 7 L33 22 C33 32 26 38 18 42 C10 38 3 32 3 22 L3 7 Z" fill="#1A1A1A" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <!-- Center vertical gold line -->
    <line x1="18" y1="9" x2="18" y2="36" stroke="url(#goldGrad)" stroke-width="1.1" stroke-linecap="round"/>
    <!-- Subtle horizontal accent -->
    <line x1="10" y1="20" x2="26" y2="20" stroke="url(#goldGrad)" stroke-width="0.6" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- Main text -->
  <text x="48" y="24" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="16" font-weight="700" fill="#1A1A1A" letter-spacing="0.3">Stratégie &amp; Expertise Santé</text>
  <!-- Subtitle with decorative lines -->
  <line x1="48" y1="32" x2="68" y2="32" stroke="url(#goldGrad)" stroke-width="0.6" stroke-linecap="round"/>
  <text x="72" y="36" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="7" fill="#C9A84C" letter-spacing="3" font-weight="400">PIONNIER EN FRANCE</text>
  <line x1="210" y1="32" x2="230" y2="32" stroke="url(#goldGrad)" stroke-width="0.6" stroke-linecap="round"/>
</svg>
