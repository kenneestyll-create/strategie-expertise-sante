  <!-- Vertical dividing line -->
  <line x1="32" y1="17" x2="32" y2="50" stroke="#C9A84C" stroke-width="1.2"/>
  <!-- Letter F -->
  <text x="19" y="38" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#C9A84C" text-anchor="middle">F</text>
  <!-- Letter S -->
  <text x="45" y="38" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#C9A84C" text-anchor="middle">S</text>
