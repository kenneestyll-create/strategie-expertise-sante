  <!-- Inner border -->
  <path d="M32 8 L13 16 L13 28 C13 43 32 55.5 32 55.5 C32 55.5 51 43 51 28 L51 16 Z" fill="none" stroke="#C9A84C" stroke-width="0.8"/>
  <!-- Vertical dividing line -->
  <line x1="32" y1="17" x2="32" y2="46" stroke="#C9A84C" stroke-width="1.2"/>
