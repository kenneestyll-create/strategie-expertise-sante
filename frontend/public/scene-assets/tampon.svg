<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- outer ring -->
  <circle cx="32" cy="32" r="24" />
  <!-- inner ring (slight offset, official-looking) -->
  <circle cx="32" cy="32" r="18" />
  <!-- handle (top stem, abstract) -->
  <line x1="32" y1="6" x2="32" y2="14" />
  <!-- center cross (validation mark) -->
  <line x1="24" y1="32" x2="28" y2="36" />
  <line x1="28" y1="36" x2="40" y2="24" />
  <!-- decorative dots (4 quadrants on inner ring, very sober) -->
  <circle cx="32" cy="18" r="0.8" fill="#C9A84C" />
  <circle cx="46" cy="32" r="0.8" fill="#C9A84C" />
  <circle cx="32" cy="46" r="0.8" fill="#C9A84C" />
  <circle cx="18" cy="32" r="0.8" fill="#C9A84C" />
</svg>
